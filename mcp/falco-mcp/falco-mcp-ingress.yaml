apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: falco-mcp
  namespace: falco
spec:
  ingressClassName: traefik
  rules:
  - host: falco-mcp.rke2-cluster1.berger.ph
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: falco-mcp
            port:
              number: 8080